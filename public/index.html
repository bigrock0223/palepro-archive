<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パレプロ アーカイブ検索（非公式）</title>
  <!-- 検索サイト専用の見た目（B案）。確認モードは style.css を使う -->
  <!-- ?v= は変更のたびに日付を変える（ブラウザに古いファイルを使わせないため） -->
  <link rel="stylesheet" href="search.css?v=20261126b">
</head>
<body>
  <header class="site-header">
    <div class="head-inner">
      <div class="brand">
        <h1>パレプロ アーカイブ検索</h1>
        <span class="unofficial">非公式</span>
      </div>
      <form class="searchbox" id="searchForm" role="search">
        <label for="q" class="sr">キーワード</label>
        <input id="q" type="search" placeholder="タイトルで検索（スペースで複数語）" autocomplete="off">
        <button type="submit">検索</button>
      </form>
      <p class="updated" id="updated"></p>
    </div>
    <div class="palette-line" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <main class="layout">
    <section class="results" aria-label="検索結果">
      <div class="results-panel" id="resultsPanel">
        <div class="results-head">
          <button type="button" class="filter-open" id="filterToggle" aria-expanded="false" aria-controls="filters">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span id="filterToggleText">絞り込み</span>
          </button>
          <p class="count" id="count" aria-live="polite"></p>
          <label class="sortbox"><span class="sortlabel">並び順</span>
            <select id="sort">
              <option value="new">新しい順</option>
              <option value="old">古い順</option>
              <option value="long">長い順</option>
              <option value="short">短い順</option>
            </select>
          </label>
          <div class="viewswitch" role="group" aria-label="表示のしかた" id="viewSwitch">
            <button type="button" data-view="list" aria-pressed="true">リスト</button>
            <button type="button" data-view="card" aria-pressed="false">カード</button>
          </div>
        </div>
        <ul class="items list" id="list"></ul>
        <p class="empty" id="empty" hidden>条件に合うアーカイブがありません。<br>条件を減らすか、「条件をクリア」を押してください。</p>
        <nav class="pager" id="pager" aria-label="ページ"></nav>
      </div>
    </section>

    <aside class="filters" id="filters" aria-label="絞り込み">
      <div class="filters-head">
        <h2>絞り込み</h2>
        <button type="button" class="linkbtn pc-only" id="reset">条件をクリア</button>
        <button type="button" class="closebtn sp-only" id="filterClose" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="filters-body">
        <fieldset class="box">
          <legend class="sr">種類</legend>
          <div class="box-head" aria-hidden="true">種類</div>
          <div class="box-body typelist" id="types"></div>
        </fieldset>

        <fieldset class="box">
          <legend class="sr">メンバー（出演）</legend>
          <div class="box-head" aria-hidden="true">メンバー（出演）</div>
          <div class="box-body">
            <div class="checklist" id="members"></div>
            <div class="subopts">
              <label><input type="checkbox" id="memberAnd"> 全員出演</label>
              <label><input type="checkbox" id="memberOnly"> 選んだメンバーだけが出演（完全一致）</label>
              <label><input type="checkbox" id="ownerOnly"> そのメンバーのチャンネルの動画だけ</label>
            </div>
          </div>
        </fieldset>

        <fieldset class="box" id="unitField">
          <legend class="sr">ユニット</legend>
          <div class="box-head" aria-hidden="true">ユニット</div>
          <div class="box-body chips" id="units"></div>
        </fieldset>

        <fieldset class="box">
          <legend class="sr">ジャンル</legend>
          <div class="box-head" aria-hidden="true">ジャンル</div>
          <div class="box-body">
            <label class="andopt"><input type="checkbox" id="genreAnd"> 選んだジャンルをすべて含む</label>
            <div class="checklist" id="genres"></div>
            <button type="button" class="linkbtn" id="genreMore" hidden></button>
          </div>
        </fieldset>

        <fieldset class="box">
          <legend class="sr">長さ・配信日</legend>
          <div class="box-head" aria-hidden="true">長さ・配信日</div>
          <div class="box-body stack">
            <label class="fieldlabel">長さ
              <select id="len">
                <option value="">指定なし</option>
                <option value="0-1800">〜30分</option>
                <option value="1800-3600">30分〜1時間</option>
                <option value="3600-7200">1〜2時間</option>
                <option value="7200-">2時間〜</option>
              </select>
            </label>
            <div class="fieldlabel">配信日
              <div class="daterow">
                <input id="from" type="date" aria-label="開始日"><span>〜</span><input id="to" type="date" aria-label="終了日">
              </div>
            </div>
            <div class="quick" id="quick">
              <button type="button" data-range="7">1週間</button>
              <button type="button" data-range="30">1か月</button>
              <button type="button" data-range="365">1年</button>
              <button type="button" data-range="0">指定なし</button>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="filters-foot sp-only">
        <button type="button" class="btn" id="resetSp">クリア</button>
        <button type="button" class="btn primary" id="filterDone">表示する</button>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <p class="updated-foot" id="updatedFoot"></p>
    当サイトは Palette Project の非公式ファンサイトです。動画情報は YouTube Data API を利用して取得しています。
    <a id="reviewLink" href="review.html" hidden>確認モード</a>
  </footer>

  <script src="data/archives.js"></script>
  <script src="app.js?v=20261126b"></script>
</body>
</html>
